<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estado de Sala · Selección Operativa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;1,500;1,600&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<meta name="theme-color" content="#ffffff">
<style>
  :root{
    --marino:#16295c;
    --marino-2:#1d3570;
    --marino-int:#22407f;
    --azul:#3f8ae0;
    --cian:#22d3ee;
    --tinta:#1f2937;
    --gris:#6b7280;
    --linea:#e3e7ee;
    --panel:#f1f3f8;
    --blanco:#ffffff;

    --frio:#2f80ed;
    --tibio:#e39a1c;
    --vivo:#2e9b57;
    --lleno:#dd3b27;

    --r:12px;
    --sombra:0 1px 3px rgba(22,41,92,.08);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}

  body{
    background:var(--blanco);
    color:var(--tinta);
    font-family:"Poppins",system-ui,sans-serif;
    font-size:15px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }

  .marco{max-width:1120px;margin:0 auto;padding:18px 16px 56px;}

  /* ── hero ─────────────────────────────────── */
  .hero{
    background:
      radial-gradient(480px 300px at 12% -15%,rgba(255,255,255,.16),transparent 60%),
      radial-gradient(460px 300px at 108% 20%,rgba(34,211,238,.3),transparent 58%),
      linear-gradient(120deg,#0f1c40 0%,var(--marino) 35%,var(--marino-2) 65%,#2f63ad 100%);
    background-size:cover;
    background-position:center;
    position:relative;
    overflow:hidden;
    border-radius:var(--r);
    padding:26px 30px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:22px;
    flex-wrap:wrap;
    color:#fff;
    box-shadow:0 18px 38px -22px rgba(22,41,92,.5);
  }

  .hero > *{position:relative;z-index:1;}

  .hero .rotulo{
    font-size:11.5px;
    font-weight:700;
    letter-spacing:.12em;
    color:#9fb6e0;
    margin:0 0 4px;
  }

  .hero h1{font-family:"Space Grotesk",system-ui,sans-serif;font-size:31px;font-weight:700;margin:0;line-height:1.15;letter-spacing:-.01em;}
  .hero h1 span{
    background:linear-gradient(90deg,var(--cian),#8fb8ff);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }

  .hero p.bajada{margin:6px 0 0;font-size:14px;color:#c3d1e8;font-weight:400;}

  .ficha{
    background:var(--marino-int);
    background-size:cover;
    background-position:center;
    border-radius:10px;
    padding:15px 20px;
    min-width:236px;
    position:relative;
    overflow:hidden;
    box-shadow:0 12px 28px -18px rgba(34,64,127,.55);
  }

  .ficha.con-foto::before{
    content:'';
    position:absolute;
    inset:0;
    background:linear-gradient(160deg,rgba(7,9,18,.94) 0%,rgba(12,16,32,.78) 55%,rgba(21,26,48,.55) 100%);
  }

  .ficha > *{position:relative;z-index:1;}

  .ficha .rotulo{margin-bottom:3px;color:#b9c0ff;}
  .ficha .destacado{font-family:"Space Grotesk",system-ui,sans-serif;font-size:19px;font-weight:600;margin:0;}
  .ficha .nota{margin:2px 0 0;font-size:13px;color:#b7bfe0;}

  .ficha .reloj{
    margin:10px 0 0;
    font-family:"JetBrains Mono",monospace;
    font-size:12.5px;
    font-weight:600;
    color:#9fb6e0;
    font-variant-numeric:tabular-nums;
    display:flex;
    align-items:center;
  }

  .ficha .reloj::before{
    content:'';
    width:7px;height:7px;
    border-radius:50%;
    background:var(--cian);
    box-shadow:0 0 9px var(--cian);
    margin-right:7px;
    animation:pulso 1.8s ease-in-out infinite;
  }

  @keyframes pulso{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.3;transform:scale(.65);}}

  /* ── resumen ──────────────────────────────── */
  .resumen{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(215px,1fr));
    gap:14px;
    margin:18px 0 0;
  }

  .tarjeta-dato{
    background:var(--panel);
    border:1px solid var(--linea);
    border-radius:10px;
    padding:14px 17px 14px 20px;
    display:flex;
    align-items:center;
    gap:13px;
    position:relative;
    overflow:hidden;
    transition:transform .25s ease,box-shadow .25s ease;
    animation:aparecer .5s ease both;
  }

  .tarjeta-dato::before{
    content:'';
    position:absolute;
    left:0;top:0;bottom:0;width:3px;
    background:linear-gradient(var(--azul),var(--cian));
  }

  .tarjeta-dato:hover{transform:translateY(-3px);box-shadow:0 14px 26px -16px rgba(22,41,92,.22);}

  .tarjeta-dato .cifra{
    font-family:"Space Grotesk",system-ui,sans-serif;
    font-size:27px;
    font-weight:700;
    line-height:1;
    font-variant-numeric:tabular-nums;
  }

  .tarjeta-dato .titulo{font-weight:600;font-size:14.5px;margin:0;}
  .tarjeta-dato .sub{margin:0;font-size:12.5px;color:var(--gris);}

  .tarjeta-dato.alerta{background:#fdf0ee;border-color:#f6d2cb;}
  .tarjeta-dato.alerta::before{background:linear-gradient(var(--lleno),#ff9a6b);}
  .tarjeta-dato.alerta .cifra{color:var(--lleno);}
  .tarjeta-dato.margen{background:#eef4fd;border-color:#cfe0f7;}
  .tarjeta-dato.margen::before{background:linear-gradient(var(--frio),var(--cian));}
  .tarjeta-dato.margen .cifra{color:var(--frio);}

  /* ── turnos ───────────────────────────────── */
  .titulo-seccion{
    font-family:"Space Grotesk",system-ui,sans-serif;
    font-size:16px;
    font-weight:600;
    margin:30px 0 13px;
    padding-bottom:9px;
    border-bottom:1px solid var(--linea);
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:12px;
    flex-wrap:wrap;
  }

  .titulo-seccion .cuando{font-family:"Poppins",system-ui,sans-serif;font-size:13px;font-weight:500;color:var(--gris);}

  .grilla{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(248px,1fr));
    gap:16px;
  }

  .turno{
    background:var(--blanco);
    border:1px solid var(--linea);
    border-top:3px solid var(--gris);
    border-radius:10px;
    padding:17px 19px 19px;
    box-shadow:var(--sombra);
    text-align:center;
    overflow:hidden;
    transition:transform .25s ease,box-shadow .25s ease;
    animation:aparecer .5s ease both;
  }

  .turno:hover{transform:translateY(-5px);}

  .foto{
    width:calc(100% + 38px);
    aspect-ratio:1/1;
    margin:-17px -19px 14px;
    background:#eceff4;
    position:relative;
    display:flex;
    align-items:flex-end;
    justify-content:flex-end;
  }

  .foto img{width:100%;height:100%;object-fit:cover;display:block;position:absolute;inset:0;}

  .foto .emoji{
    display:none;
    position:relative;
    z-index:1;
    font-size:22px;
    margin:0 11px 9px 0;
    text-shadow:0 1px 4px rgba(0,0,0,.45);
  }

  .foto.sin-foto{background:linear-gradient(135deg,currentColor 0%,#dfe4ee 150%);}
  .foto.sin-foto img{display:none;}
  .foto.sin-foto .emoji{
    display:flex;
    align-items:center;
    justify-content:center;
    position:absolute;
    inset:0;
    margin:0;
    font-size:34px;
  }

  .turno .hora{
    font-family:"Space Grotesk",system-ui,sans-serif;
    font-size:29px;
    font-weight:700;
    margin:0;
    line-height:1.1;
    font-variant-numeric:tabular-nums;
  }

  .turno .fecha{margin:1px 0 12px;font-size:12.5px;color:var(--gris);font-weight:500;}
  .turno .personas{font-size:15px;margin:0 0 3px;font-weight:500;}
  .turno .personas b{font-family:"Space Grotesk",system-ui,sans-serif;font-size:22px;font-weight:700;}
  .turno .apodo{font-style:italic;font-weight:600;font-size:14px;margin:0 0 13px;}

  .medidor{height:7px;background:#eceff4;border-radius:99px;overflow:hidden;}

  .medidor span{
    display:block;height:100%;width:0;border-radius:99px;
    transition:width .65s cubic-bezier(.22,.61,.36,1);
  }

  .turno .ocupacion{
    margin:8px 0 0;
    font-family:"JetBrains Mono",monospace;
    font-size:12px;
    color:var(--gris);
    font-variant-numeric:tabular-nums;
  }

  .turno.pasado{opacity:.45;}

  .t-frio{border-top-color:var(--frio);box-shadow:var(--sombra),0 0 28px -8px rgba(47,128,237,.55);}
  .t-frio .hora,.t-frio .apodo{color:var(--frio);}
  .t-frio .foto{color:var(--frio);}
  .t-frio .medidor span{background:linear-gradient(90deg,var(--frio),#7dd3fc);box-shadow:0 0 10px var(--frio);}
  .t-frio:hover{box-shadow:var(--sombra),0 0 46px -6px rgba(47,128,237,.75);}

  .t-tibio{border-top-color:var(--tibio);box-shadow:var(--sombra),0 0 28px -8px rgba(227,154,28,.55);}
  .t-tibio .hora,.t-tibio .apodo{color:var(--tibio);}
  .t-tibio .foto{color:var(--tibio);}
  .t-tibio .medidor span{background:linear-gradient(90deg,var(--tibio),#fde68a);box-shadow:0 0 10px var(--tibio);}
  .t-tibio:hover{box-shadow:var(--sombra),0 0 46px -6px rgba(227,154,28,.75);}

  .t-vivo{border-top-color:var(--vivo);box-shadow:var(--sombra),0 0 28px -8px rgba(46,155,87,.55);}
  .t-vivo .hora,.t-vivo .apodo{color:var(--vivo);}
  .t-vivo .foto{color:var(--vivo);}
  .t-vivo .medidor span{background:linear-gradient(90deg,var(--vivo),#6ee7b7);box-shadow:0 0 10px var(--vivo);}
  .t-vivo:hover{box-shadow:var(--sombra),0 0 46px -6px rgba(46,155,87,.75);}

  .t-lleno{border-top-color:var(--lleno);animation:aparecer .5s ease both,alerta 2.2s ease-in-out .5s infinite;}
  .t-lleno .hora,.t-lleno .apodo{color:var(--lleno);}
  .t-lleno .foto{color:var(--lleno);}
  .t-lleno .medidor span{background:linear-gradient(90deg,var(--lleno),#ff9a6b);box-shadow:0 0 10px var(--lleno);}
  .t-lleno:hover{box-shadow:var(--sombra),0 0 56px -4px rgba(221,59,39,.9);}

  @keyframes alerta{
    0%,100%{box-shadow:var(--sombra),0 0 26px -8px rgba(221,59,39,.5);}
    50%{box-shadow:var(--sombra),0 0 48px -6px rgba(221,59,39,.85);}
  }

  /* ── pie ──────────────────────────────────── */
  .referencia{
    display:flex;
    flex-wrap:wrap;
    gap:9px 22px;
    margin:30px 0 0;
    padding-top:17px;
    border-top:1px solid var(--linea);
    font-size:13px;
    color:var(--gris);
  }

  .referencia span{display:flex;align-items:center;gap:7px;}

  .punto{width:9px;height:9px;border-radius:50%;display:inline-block;}

  .pie{margin:13px 0 0;font-size:12.5px;color:var(--gris);}

  .vacio{
    margin:22px 0;
    padding:30px;
    background:var(--panel);
    border:1px solid var(--linea);
    border-radius:10px;
    text-align:center;
    color:var(--gris);
  }

  .vacio b{display:block;color:var(--tinta);font-size:16px;margin-bottom:5px;}

  @keyframes aparecer{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}

  :focus-visible{outline:2px solid var(--azul);outline-offset:3px;}

  @media (prefers-reduced-motion:reduce){
    *{transition:none!important;animation:none!important;}
  }

  @media (max-width:640px){
    .hero{padding:22px;}
    .hero h1{font-size:26px;}
    .ficha{width:100%;}
  }
</style>
</head>
<body>
<main class="marco">

  <section class="hero">
    <div>
      <p class="rotulo">EQUIPO DE SELECCIÓN Y RRHH</p>
      <h1>Estado de <span>Sala</span></h1>
      <p class="bajada">Confirmaciones por turno, en vivo.</p>
    </div>
    <div class="ficha">
      <p class="rotulo">PRÓXIMO TURNO</p>
      <p class="destacado" id="ficha-titulo">—</p>
      <p class="nota" id="ficha-nota">Cargando confirmaciones…</p>
      <p class="reloj" id="reloj">--:--:--</p>
    </div>
  </section>

  <div class="resumen" id="resumen"></div>
  <div id="contenido"></div>

  <div class="referencia" id="referencia"></div>
  <p class="pie">Se actualiza sola cada minuto. Los mismos datos que Clippy manda al grupo. <span id="sello"></span></p>

</main>

<script>
/* ════════════════════════════════════════
   CONFIG
   ════════════════════════════════════════ */
const CUPO_DEFAULT = 40;                  // mismo valor que el Code node de n8n
const VENTANA_HS   = 72;
// URL /exec de la Web App de Apps Script (ver apps-script.gs).
// Dejalo en '' para trabajar con DATOS_DEMO.
const FUENTE       = 'https://script.google.com/macros/s/AKfycbwsefXNHh2d0U6Lb0flkK9qAfYOf-IPZ_eIuS4YLYSHyGtNA_kbn5fwyWKn1KUJbCP_LQ/exec';
const REFRESCO_MS  = 60000;

/* Imágenes. Dejá '' en cualquiera y cae al emoji / al degradé liso. */
const BANNER = 'img/banner.jpg';

const DATOS_DEMO = [
  { fecha:'2026-09-15T09:00:00', sede:'DEFAULT', confirmados:21, cupo:40 },
  { fecha:'2026-09-15T11:00:00', sede:'DEFAULT', confirmados:18, cupo:40 },
  { fecha:'2026-09-15T14:00:00', sede:'DEFAULT', confirmados:28, cupo:40 },
  { fecha:'2026-09-15T16:00:00', sede:'DEFAULT', confirmados:28, cupo:40 },
  { fecha:'2026-09-16T09:00:00', sede:'DEFAULT', confirmados:71, cupo:40 },
  { fecha:'2026-09-16T11:00:00', sede:'DEFAULT', confirmados:65, cupo:40 },
  { fecha:'2026-09-24T11:00:00', sede:'DEFAULT', confirmados:1,  cupo:40 }
];

const ESCALA = [
  { hasta:0.45,     clase:'t-frio',  emoji:'🦗', texto:'paspando moscas', color:'var(--frio)',  foto:'img/Paspando moscas.jpg' },
  { hasta:0.66,     clase:'t-tibio', emoji:'🐢', texto:'calentando motores', color:'var(--tibio)', foto:'img/Apenas movido.jpg' },
  { hasta:0.91,     clase:'t-vivo',  emoji:'🔥', texto:'A full',          color:'var(--vivo)',  foto:'img/Sala viva.jpg' },
  { hasta:Infinity, clase:'t-lleno', emoji:'🚨', texto:'explotado',       color:'var(--lleno)', foto:'img/Explotado.jpg' }
];

/* ════════════════════════════════════════
   HELPERS
   ════════════════════════════════════════ */
const $ = (id) => document.getElementById(id);
const pad = (n) => String(n).padStart(2,'0');
const MS_HORA = 3600000;

const DIAS  = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

const tramoDe = (r) => ESCALA.find(t => r < t.hasta) || ESCALA[ESCALA.length-1];

function rotularDia(fecha, hoy){
  const a = new Date(hoy.getFullYear(),hoy.getMonth(),hoy.getDate());
  const b = new Date(fecha.getFullYear(),fecha.getMonth(),fecha.getDate());
  const dif = Math.round((b-a)/86400000);
  if (dif === 0) return 'Hoy';
  if (dif === 1) return 'Mañana';
  return `${DIAS[fecha.getDay()]} ${fecha.getDate()} de ${MESES[fecha.getMonth()]}`;
}

function faltaTexto(ms){
  if (ms <= 0) return 'En curso';
  const h = Math.floor(ms/MS_HORA);
  const m = Math.floor((ms % MS_HORA)/60000);
  const s = Math.floor((ms % 60000)/1000);
  if (h >= 24){ const d = Math.floor(h/24); return `Empieza en ${d} ${d===1?'día':'días'} y ${h%24}h`; }
  if (h >= 1)  return `Empieza en ${h}h ${pad(m)}m`;
  return `Empieza en ${pad(m)}m ${pad(s)}s`;
}

const escapar = (s) => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ════════════════════════════════════════
   DATOS
   ════════════════════════════════════════ */
let TURNOS = [];
let proximoTurno = null;

function normalizar(filas){
  return filas.map(f => {
    const fecha = new Date(f.fecha);
    const cupo = Number(f.cupo) || CUPO_DEFAULT;
    const confirmados = Number(f.confirmados) || 0;
    const ratio = cupo > 0 ? confirmados/cupo : 0;
    // El tramo se calcula siempre acá según ESCALA (fuente única de verdad):
    // así una etiqueta vieja que mande el origen no pisa el umbral actual.
    const tramo = tramoDe(ratio);
    return { fecha, cupo, confirmados, ratio, sede:f.sede || 'DEFAULT', tramo };
  })
  .filter(t => !isNaN(t.fecha))
  .sort((a,b) => a.fecha - b.fecha);
}

async function traer(){
  if (!FUENTE) return DATOS_DEMO;

  try{
    const r = await fetch(`${FUENTE}?t=${Date.now()}`, {cache:'no-store'});
    if (!r.ok) throw new Error(r.status);
    const j = await r.json();
    return Array.isArray(j) ? j : (j.detalle || DATOS_DEMO);
  }catch(e){
    // Apps Script a veces rebota el fetch por CORS: reintenta por JSONP
    try{
      const j = await traerJsonp();
      return Array.isArray(j) ? j : (j.detalle || DATOS_DEMO);
    }catch(e2){
      return DATOS_DEMO;
    }
  }
}

function traerJsonp(){
  return new Promise((resolve, reject) => {
    const nombre = `clippy_${Date.now()}`;
    const tag = document.createElement('script');
    const limpiar = () => { delete window[nombre]; tag.remove(); };

    window[nombre] = (datos) => { limpiar(); resolve(datos); };
    tag.onerror = () => { limpiar(); reject(new Error('jsonp')); };
    tag.src = `${FUENTE}?callback=${nombre}&t=${Date.now()}`;
    document.body.appendChild(tag);

    setTimeout(() => { if (window[nombre]){ limpiar(); reject(new Error('timeout')); } }, 8000);
  });
}

/* ════════════════════════════════════════
   RENDER
   ════════════════════════════════════════ */
function pintar(){
  const ahora = new Date();
  const vigentes = TURNOS.filter(t => t.fecha >= new Date(ahora - MS_HORA));
  const enVentana = vigentes.filter(t => (t.fecha-ahora)/MS_HORA <= VENTANA_HS);
  proximoTurno = vigentes[0] || null;

  pintarFicha(ahora);
  pintarReferencia();
  $('sello').textContent = `Última lectura ${pad(ahora.getHours())}:${pad(ahora.getMinutes())}.`;

  if (!vigentes.length){
    $('resumen').innerHTML = '';
    $('contenido').innerHTML = `<div class="vacio"><b>Todavía no hay turnos cargados</b>
      Cuando se confirmen postulantes para una fecha futura van a aparecer acá.</div>`;
    return;
  }

  const totalVentana = enVentana.reduce((a,t)=>a+t.confirmados,0);
  const llenos = vigentes.filter(t => t.tramo.clase === 't-lleno');
  const frios  = vigentes.filter(t => t.tramo.clase === 't-frio' && (t.fecha-ahora)/MS_HORA <= 48);

  const datos = [
    { cifra:totalVentana, titulo:'Confirmados', sub:`En las próximas ${VENTANA_HS}hs`, clase:'' },
    { cifra:enVentana.length, titulo:'Turnos activos', sub:'Con gente citada', clase:'' }
  ];
  if (llenos.length) datos.push({ cifra:llenos.length, titulo:'Turnos explotados', sub:'Sumar selector o frenar citaciones', clase:'alerta' });
  if (frios.length)  datos.push({ cifra:frios.length, titulo:'Salas vacías', sub:'Hay margen para citar más', clase:'margen' });

  $('resumen').innerHTML = datos.map(d => `
    <div class="tarjeta-dato ${d.clase}">
      <div class="cifra">${d.cifra}</div>
      <div><p class="titulo">${d.titulo}</p><p class="sub">${escapar(d.sub)}</p></div>
    </div>`).join('');

  const lista = enVentana.length ? enVentana : vigentes.slice(0,8);
  const porDia = new Map();
  for (const t of lista){
    const rot = rotularDia(t.fecha, ahora);
    if (!porDia.has(rot)) porDia.set(rot, []);
    porDia.get(rot).push(t);
  }

  let html = '';
  for (const [dia, turnos] of porDia){
    const total = turnos.reduce((a,t)=>a+t.confirmados,0);
    html += `<h2 class="titulo-seccion">${escapar(dia)}
      <span class="cuando">${total} confirmados en ${turnos.length} ${turnos.length===1?'turno':'turnos'}</span></h2>`;
    html += '<div class="grilla">';
    for (const t of turnos){
      const sede = t.sede === 'DEFAULT' ? '' : ` · ${escapar(t.sede)}`;
      html += `<article class="turno ${t.tramo.clase}${t.fecha < ahora ? ' pasado' : ''}">
        ${avatar(t.tramo)}
        <p class="hora">${pad(t.fecha.getHours())}:${pad(t.fecha.getMinutes())}</p>
        <p class="fecha">${pad(t.fecha.getDate())}/${pad(t.fecha.getMonth()+1)}${sede}</p>
        <p class="personas"><b>${t.confirmados}</b> confirmados</p>
        <p class="apodo">${t.tramo.emoji} ${escapar(t.tramo.texto)}</p>
        <div class="medidor"><span data-ancho="${Math.min(100, Math.round(t.ratio*100))}"></span></div>
        <p class="ocupacion">${Math.round(t.ratio*100)}% de la sala</p>
      </article>`;
    }
    html += '</div>';
  }

  const lejanos = vigentes.filter(t => (t.fecha-ahora)/MS_HORA > VENTANA_HS);
  if (lejanos.length){
    const tot = lejanos.reduce((a,t)=>a+t.confirmados,0);
    html += `<p class="pie">Más adelante: ${tot} confirmados en ${lejanos.length} ${lejanos.length===1?'turno':'turnos'}.</p>`;
  }

  $('contenido').innerHTML = html;

  requestAnimationFrame(() => {
    document.querySelectorAll('.medidor span').forEach(el => { el.style.width = el.dataset.ancho + '%'; });
  });
}

function avatar(tramo){
  if (!tramo.foto){
    return `<div class="foto sin-foto"><span class="emoji">${tramo.emoji}</span></div>`;
  }
  return `<div class="foto"><img src="${escapar(tramo.foto)}" alt="${escapar(tramo.texto)}"
    onerror="this.closest('.foto').classList.add('sin-foto')"><span class="emoji">${tramo.emoji}</span></div>`;
}

function pintarFicha(ahora){
  if (!proximoTurno){
    $('ficha-titulo').textContent = 'Sin turnos';
    $('ficha-nota').textContent = 'No hay confirmaciones a futuro.';
    return;
  }
  const p = proximoTurno;
  $('ficha-titulo').textContent = `${rotularDia(p.fecha, ahora)} ${pad(p.fecha.getHours())}:${pad(p.fecha.getMinutes())}`;
  $('ficha-nota').textContent = `${p.confirmados} confirmados · ${p.tramo.emoji} ${p.tramo.texto}`;
}

function pintarReferencia(){
  $('referencia').innerHTML = ESCALA.map(e =>
    `<span><i class="punto" style="background:${e.color};box-shadow:0 0 8px ${e.color}"></i>${e.emoji} ${e.texto}</span>`).join('');
}

/* ════════════════════════════════════════
   LATIDO
   ════════════════════════════════════════ */
function tic(){
  const ahora = new Date();
  $('reloj').textContent = proximoTurno
    ? faltaTexto(proximoTurno.fecha - ahora).toUpperCase()
    : `${pad(ahora.getHours())}:${pad(ahora.getMinutes())}:${pad(ahora.getSeconds())}`;
}

async function recargar(){
  TURNOS = normalizar(await traer());
  pintar();
}

if (BANNER){
  const ficha = document.querySelector('.ficha');
  ficha.style.backgroundImage = `url('${BANNER}')`;
  ficha.classList.add('con-foto');
}

recargar();
setInterval(tic, 1000);
setInterval(recargar, REFRESCO_MS);
</script>
</body>
</html>
